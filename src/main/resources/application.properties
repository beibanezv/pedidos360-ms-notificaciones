# Pedidos360 - ms-notificaciones (desarrollo local)
server.port=8085

# Broker RabbitMQ: el clúster de ms-admin/docker/rabbitmq-cluster (nodo 1).
# En AWS se cambia RABBITMQ_HOST por la IP privada de la EC2 p360-rabbit.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# El consumidor usa Channel + basicAck/basicNack explícitos.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# Correo SMTP: credenciales SIEMPRE por env vars (nunca commiteadas).
# Sin credenciales la app arranca igual; el envío falla al intentarse.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Remitente y bandeja demo (por defecto, la propia cuenta de Gmail).
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.to=${MAIL_TO:${MAIL_USERNAME:}}
